aid: raincards
name: Rain (Raincards)
description: >-
  Rain is a stablecoin payments infrastructure company that lets platforms,
  fintechs, and institutions issue cards, open virtual accounts and wallets, and
  move money globally through a single API. Its issuing platform turns
  self-custodied stablecoin collateral and digital-dollar balances into
  Visa/Mastercard-accepted spending at over 175 million merchant locations,
  connecting blockchain settlement rails to traditional card networks. Products
  include card issuing, corporate/spend cards, virtual accounts, onramps and
  offramps, and cross-border payment processing. Rain is a Mastercard Principal
  Member and is backed by Norwest Venture Partners, Sapphire Ventures,
  Lightspeed, and Coinbase Ventures. The public developer surface is a gated
  Mintlify documentation portal at docs.rain.xyz covering the Rain Issuing API;
  the OpenAPI/Swagger reference is behind login and not publicly retrievable.
